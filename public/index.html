<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Notice Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Team Notice Board</h1>
            <p>Share updates and collaborate in real-time</p>
        </header>

        <main>
            <section class="post-section">
                <form id="post-form">
                    <input type="text" id="author-input" placeholder="Your Name" required>
                    <textarea id="message-input" placeholder="What's on your mind? Share an update with the team..." required></textarea>
                    <button type="submit">Post Update</button>
                </form>
            </section>

            <section class="board-section" id="board">
                <div class="loader">Loading messages...</div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
